<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Paigala Delli Sankar — AI and Data Science Engineer</title>
  <desc id="desc">A monochrome animated profile banner with a scanning signal, orbiting nodes, and an active build status.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505" />
      <stop offset="0.52" stop-color="#151515" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.055" />
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="12" y="12" width="1176" height="396" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#000000" />
  <rect x="12" y="12" width="1176" height="396" rx="24" fill="url(#background)" stroke="#5b5b5b" stroke-width="1" />

  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="1176" height="396" fill="url(#grid)" />

    <rect x="-320" y="12" width="300" height="396" fill="url(#scan)" opacity="0.55">
      <animate attributeName="x" from="-320" to="1220" dur="7s" repeatCount="indefinite" />
    </rect>

    <path d="M 48 350 C 190 300, 260 385, 388 335 S 650 285, 760 345 S 1000 390, 1165 305" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.5s" repeatCount="indefinite" />
    </path>

    <g transform="translate(940 208)">
      <circle r="126" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle r="94" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="1 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
      </circle>
      <circle r="58" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1" />
      <circle r="8" fill="#ffffff" filter="url(#soft-glow)">
        <animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="-126" r="4" fill="#ffffff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="94" r="3" fill="#aaaaaa">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
      </circle>
      <path d="M -26 0 H 26 M 0 -26 V 26" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    </g>

    <g fill="#ffffff" font-family="monospace">
      <text x="72" y="96" font-size="14" letter-spacing="4" fill="#aaaaaa">AI / DATA / ROBOTICS</text>
      <text x="72" y="188" font-size="58" font-weight="700" letter-spacing="7">PAIGALA</text>
      <text x="72" y="246" font-size="42" font-weight="700" letter-spacing="5" fill="#d2d2d2">DELLI SANKAR</text>
      <text x="75" y="278" font-size="14" letter-spacing="3" fill="#888888">TURNING IDEAS INTO SYSTEMS</text>

      <rect x="72" y="320" width="194" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#777777" />
      <circle cx="94" cy="337" r="5" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="110" y="342" font-size="12" letter-spacing="2" fill="#eeeeee">SYSTEM ONLINE</text>

      <text x="1058" y="350" font-size="12" letter-spacing="2" fill="#888888">BUILD / 001</text>
      <line x1="1058" y1="365" x2="1144" y2="365" stroke="#ffffff" stroke-opacity="0.65" />
      <line x1="1058" y1="365" x2="1058" y2="353" stroke="#ffffff" stroke-opacity="0.65" />
      <line x1="1144" y1="365" x2="1144" y2="377" stroke="#ffffff" stroke-opacity="0.65" />
    </g>
  </g>
</svg>
